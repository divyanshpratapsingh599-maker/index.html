<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hey Anushka 🥰</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff0f6,#ffe4ec,#f7eaff);min-height:100vh;display:grid;place-items:center;color:#351b2b;overflow:hidden}.card{width:min(92vw,430px);min-height:520px;padding:38px 24px;border-radius:30px;background:rgba(255,255,255,.8);box-shadow:0 20px 60px rgba(160,60,100,.18);text-align:center;display:flex;flex-direction:column;justify-content:center;position:relative}.heart{font-size:58px;animation:beat 1.2s infinite}.small{color:#9b657e;font-size:14px}.question{font-size:27px;font-weight:750;line-height:1.25;margin:18px 0 28px}.buttons{display:flex;gap:14px;justify-content:center;min-height:54px;position:relative}.btn{border:0;border-radius:999px;padding:14px 25px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(100,40,80,.12)}.yes{background:#ff5d91;color:white}.no{background:white;color:#8a536b;border:1px solid #f0cad8}.hidden{display:none}.progress{position:absolute;top:18px;left:24px;right:24px;height:5px;background:#f3dce6;border-radius:99px;overflow:hidden}.bar{height:100%;background:#ff6f9e;width:20%;transition:.35s}.note{font-size:14px;color:#8e6577;margin-top:20px}@keyframes beat{50%{transform:scale(1.12)}}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style></head>
<body><main class="card"><div class="progress"><div class="bar" id="bar"></div></div><div id="app"></div></main>
<script>
const steps=[
 ['🥰','Hey Anushka 🥰','Welcome page… I have a few things to ask you 😁'],
 ['😁','How are u Basantii ?? 😁','Hope you’re doing good!'],
 ['💖','Do u love me 😭😭💖 ??','Okay… this one is important 👀'],
 ['🥀','Do u wanna be yours ???','No pressure — just answer honestly 🥀😭'],
 ['🌸',"Can we meet together if you don't mind ....🥀😭",'Maybe a little coffee/walk and a lot of talking?'],
 ['❤️','One last thing…','Whatever your answer, thank you for reading this ❤️']
];
let i=0; const app=document.getElementById('app'),bar=document.getElementById('bar');
function render(){const [emoji,q,n]=steps[i];bar.style.width=((i+1)/steps.length*100)+'%';app.innerHTML=`<div class="heart">${emoji}</div><div class="small">A tiny message for you</div><div class="question">${q}</div><div class="buttons">${i<steps.length-1?`<button class="btn yes" id="yes">Yes 💖</button><button class="btn no" id="no">No 🙈</button>`:`<button class="btn yes" id="finish">❤️ I read it</button>`}</div><div class="note">${n}</div>`;
if(i<steps.length-1){document.getElementById('yes').onclick=()=>{i++;render()};document.getElementById('no').onclick=()=>{i++;render()};}
else document.getElementById('finish').onclick=()=>{app.innerHTML='<div class="heart">💗</div><div class="question">Thank you, Anushka 🥰</div><div class="note">Whatever happens, I hope you keep smiling.</div>';bar.style.width='100%';}}
render();
</script></body></html>
